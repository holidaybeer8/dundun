<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>든든해장국밥 월간 정산서</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Brush+Script&display=swap" />
<style>
/* ===== 감골연탄집 정산서 v4 — 브랜드 모바일 앱 테마 ===== */
:root {
  --paper: #f3f1ec;        /* 크림 배경 */
  --card: #fffdf8;
  --ink: #2b2118;          /* 브라운 블랙 */
  --muted: #8a7a67;
  --line: #e7ddcc;
  --line-strong: #d2c4ad;
  --brand: #a1352c;        /* 로고 브라운 */
  --leaf: #3d6b4a;         /* 잎 그린 */
  --ember: #a1352c;        /* 감 오렌지 (버튼·포인트) */
  --ember-soft: #f7e6e1;
  --chipbg: #ece8de;
  --stickybg: #1d1a17;
  --stickyink: #f4ede2;
  --stickymut: #b9a992;
  --pos: #1662ce;          /* GOOD 파랑 */
  --neg: #cc372a;          /* 점검필요 빨강 */
  --shadow: 0 1px 3px rgba(43, 33, 24, 0.09);
  --focus: #a1352c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #201b16;
    --card: #2a241d;
    --ink: #efe7da;
    --muted: #a8988a;
    --line: #3f372c;
    --line-strong: #52483a;
    --brand: #e08a7d;
    --leaf: #6f9b7e;
    --ember: #cf7466;
    --ember-soft: #3d2a26;
    --chipbg: #372f25;
    --stickybg: #14100d;
    --stickyink: #f4ede2;
    --stickymut: #a89d8d;
    --pos: #79aaff;
    --neg: #ff8072;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
    --focus: #cf7466;
  }
}
:root[data-theme="dark"] {
  --paper: #201b16;
  --card: #2a241d;
  --ink: #efe7da;
  --muted: #a8988a;
  --line: #3f372c;
  --line-strong: #52483a;
  --brand: #e08a7d;
  --leaf: #6f9b7e;
  --ember: #cf7466;
  --ember-soft: #3d2a26;
  --chipbg: #372f25;
  --stickybg: #14100d;
  --stickyink: #f4ede2;
  --stickymut: #a89d8d;
  --pos: #79aaff;
  --neg: #ff8072;
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
  --focus: #cf7466;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-size: 15px;
  line-height: 1.5;
}
/* 모바일 전용 앱 느낌: PC에서도 폰 너비로 가운데 정렬 */
.wrap {
  max-width: 480px;
  margin: 0 auto;
  padding: 0 14px 110px; /* 하단 고정 버튼 공간 */
}
.print-only { display: none; }

/* ---- 앱 헤더 (로고) ---- */
.masthead {
  text-align: center;
  padding: 18px 0 6px;
}
.logo-svg {
  width: 190px;
  height: auto;
  display: block;
  margin: 0 auto;
}
.logo-word {
  margin: 2px 0 0;
  font-family: "Jua", "IBM Plex Sans KR", sans-serif;
  font-size: 34px;
  color: var(--brand);
  letter-spacing: 0.04em;
  line-height: 1.1;
}
.masthead h1 {
  margin: 2px 0 0;
  font-size: 15px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.02em;
}
.credit-top {
  margin: 3px 0 0;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--ember);
  letter-spacing: 0.06em;
}

/* ---- 카카오톡 안 브라우저 안내 ---- */
.kakao-banner {
  margin: 10px 0 0;
  padding: 10px 14px;
  border-radius: 12px;
  background: #3b2410;
  color: #ffe9d6;
  font-size: 13.5px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.kakao-warn {
  margin: 10px 0 0;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1.5px solid var(--ember);
  background: var(--ember-soft);
  font-size: 13px;
  line-height: 1.55;
}
.kakao-warn .kakao-open {
  display: block;
  width: 100%;
  margin-top: 8px;
}

/* ---- 예시자료 배너 ---- */
.sample-banner {
  margin: 10px 0 0;
  padding: 10px 14px;
  border-radius: 12px;
  background: var(--ember);
  color: #fff;
  font-size: 13.5px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.sample-exit {
  margin-left: auto;
  border: 1px solid rgba(255, 255, 255, 0.6);
  background: transparent;
  color: #fff;
  border-radius: 8px;
  padding: 4px 10px;
  font: inherit;
  font-size: 12.5px;
  cursor: pointer;
}

/* ---- 자동저장 상태 ---- */
.savebar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin: 0 0 14px;
}
.savechip {
  font-size: 12px;
  color: var(--muted);
  background: var(--chipbg);
  border-radius: 999px;
  padding: 5px 12px;
}
.savechip.saved { color: var(--pos); }
.savechip.saving { color: var(--ember); }
.savechip.error { color: #fff; background: var(--neg); }
.savechip.sample { color: #fff; background: var(--ember); }
.privacy-mini {
  font-size: 10.5px;
  color: var(--muted);
  line-height: 1.4;
}
.savedsel {
  font: inherit;
  font-size: 13px;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  padding: 6px 10px;
  max-width: 100%;
}

/* ---- 상단 고정 요약 ---- */
.sticky {
  position: sticky;
  top: 8px;
  z-index: 50;
  margin: 12px 0 10px;
  border-radius: 14px;
  background: var(--stickybg);
  color: var(--stickyink);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
  overflow: hidden;
}
.sticky-main {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 10px 14px;
  background: none;
  border: 0;
  color: inherit;
  font: inherit;
  cursor: pointer;
  text-align: left;
}
.sk { display: flex; flex-direction: column; min-width: 0; }
.sk em { font-style: normal; font-size: 10.5px; color: var(--stickymut); letter-spacing: 0.04em; }
.sk b {
  font-size: 14.5px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sk-profit { margin-left: auto; align-items: flex-end; }
.sk-profit b { font-size: 16.5px; }
.sk-profit i { font-style: normal; font-size: 11.5px; color: var(--stickymut); }
.sk-profit.pos b, .sk-profit.pos i { color: #8ab8ff; }
.sk-profit.neg b, .sk-profit.neg i { color: #ff9184; }
.chev { color: var(--stickymut); transition: transform 0.15s; flex: none; }
.chev.open { transform: rotate(180deg); }
.sticky-detail { padding: 4px 14px 12px; border-top: 1px solid rgba(255, 255, 255, 0.12); }
.sticky-detail .sumrow { border-color: rgba(255, 255, 255, 0.1); }
.sticky-detail .sumrow-label { color: var(--stickymut); }
.sticky-detail .sumrow-pct { color: var(--stickymut); }
.sticky-detail .rowgood .sumrow-amt, .sticky-detail .rowgood .sumrow-pct { color: #8ab8ff; }
.sticky-detail .rowbad .sumrow-amt, .sticky-detail .rowbad .sumrow-pct { color: #ff9184; }
.sticky-detail .profitline.pos .sumrow-amt, .sticky-detail .profitline.pos .sumrow-pct { color: #8ab8ff; }
.sticky-detail .profitline.neg .sumrow-amt, .sticky-detail .profitline.neg .sumrow-pct { color: #ff9184; }

/* ---- 관리 버튼 ---- */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 8px; }
.btn {
  padding: 9px 14px;
  border-radius: 10px;
  border: 1px solid var(--line-strong);
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--ember); border-color: var(--ember); color: #fff; }
.btn-danger { color: var(--neg); }

/* ---- 하단 고정 버튼 (앱 스타일) ---- */
.bottombar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  z-index: 60;
  width: min(480px, 100%);
  display: flex;
  gap: 8px;
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
  background: var(--paper); /* color-mix 미지원 브라우저용 대비 배경 */
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(6px);
  border-top: 1px solid var(--line);
}
.bigbtn {
  flex: 1;
  padding: 13px 8px;
  border-radius: 14px;
  border: 1.5px solid var(--ember);
  background: var(--card);
  color: var(--ember);
  font: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: var(--shadow);
}
.bigbtn.primary { background: var(--ember); color: #fff; }
.bigbtn:disabled { opacity: 0.55; }
.bigbtn:active { transform: translateY(1px); }

/* ---- 카드 ---- */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow);
  margin: 0 0 14px;
  overflow: hidden;
}
.card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px 0;
}
.stepnum {
  flex: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--ember);
  color: #fff;
  font-size: 13.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-head h2 { margin: 0; font-size: 17px; font-weight: 700; color: var(--brand); }
.card-head .sub { margin: 1px 0 0; font-size: 12.5px; color: var(--muted); }
.card-body { padding: 12px 14px 14px; }

/* ---- 입력 (모바일: 16px = iOS 자동확대 방지) ---- */
input[type="text"], input[type="month"], .money, .storesel, .field textarea {
  font: inherit;
  font-size: 16px;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  padding: 10px;
  min-width: 0;
  width: 100%;
}
input:focus-visible, button:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 1px;
}
.money {
  text-align: right;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}
.money-bold { font-size: 18px; font-weight: 700; }
.pct {
  flex: none;
  min-width: 50px;
  text-align: right;
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  background: var(--chipbg);
  border-radius: 7px;
  padding: 3px 6px;
}
.pct-good { color: #fff; background: var(--pos); font-weight: 700; }
.pct-bad { color: #fff; background: var(--neg); font-weight: 700; }

/* 기본 정보 */
.basicgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > span { font-size: 12.5px; font-weight: 500; color: var(--muted); }
.field-sales { grid-column: 1 / -1; }
.field-sales > span { color: var(--ember); font-weight: 700; }
.field-memo { grid-column: 1 / -1; }
.field textarea { resize: vertical; min-height: 52px; font-size: 16px; }
.req {
  font-style: normal;
  font-size: 10.5px;
  font-weight: 700;
  color: #fff;
  background: var(--ember);
  border-radius: 5px;
  padding: 1px 5px;
  vertical-align: 1px;
}
input.need, select.need { border-color: var(--ember); box-shadow: 0 0 0 1px var(--ember) inset; }
.hint { margin: 10px 0 0; font-size: 12px; color: var(--muted); }

/* ---- 진단 배지: GOOD(파랑) / 점검필요(빨강) ---- */
.diagbadge {
  display: inline-block;
  margin-left: 6px;
  padding: 1.5px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  vertical-align: 1px;
  white-space: nowrap;
  color: #fff;
}
.diagbadge.danger { background: var(--neg); }
.diagbadge.good { background: var(--pos); }
.legend {
  margin: 10px 0 0;
  font-size: 12px;
  color: var(--muted);
}
.legend .diagbadge { margin: 0 2px; vertical-align: 0; }

/* ---- 재료비 행 ---- */
.matrow { padding: 10px 0; border-bottom: 1px solid var(--line); }
.matrow:last-of-type { border-bottom: 0; }
.matrow-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.matrow-name { flex: 1 1 100%; min-width: 0; display: flex; align-items: baseline; gap: 6px; }
.matrow-name b { font-size: 15px; }
.desc { font-size: 11.5px; color: var(--muted); }
.matrow-top .money { flex: 1 1 0; width: auto; }
.memo {
  margin-top: 7px;
  font-size: 13px;
  padding: 7px 9px;
  border-style: dashed;
  background: transparent;
}

/* ---- 동적 행 ---- */
.dynrow { display: flex; align-items: center; gap: 7px; padding: 6px 0; }
.dynrow .namein { flex: 1 1 34%; font-size: 15px; }
.dynrow .money { flex: 1 1 100px; }
.dynrow-plain { border-bottom: 1px solid var(--line); padding: 9px 0; flex-wrap: wrap; }
.dynrow-plain:last-of-type { border-bottom: 0; }
.fixname { flex: 1 1 40%; font-size: 15px; font-weight: 500; }
.autodesc { display: block; color: var(--ember); font-weight: 500; }
.autoval {
  flex: 0 1 145px;
  text-align: right;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  padding: 10px;
  border-radius: 10px;
  background: var(--chipbg);
}
.del {
  flex: none;
  width: 34px;
  height: 34px;
  border-radius: 9px;
  border: 1px solid var(--line-strong);
  background: transparent;
  color: var(--neg);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
}
.subhead {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 14px 0 4px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
  font-size: 14.5px;
}
.subhead:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.emptymsg { margin: 4px 0; font-size: 13px; color: var(--muted); }
.addbtn {
  margin: 6px 0 2px;
  padding: 11px 12px;
  width: 100%;
  border: 1.5px dashed var(--line-strong);
  border-radius: 12px;
  background: transparent;
  color: var(--ember);
  font: inherit;
  font-size: 14.5px;
  font-weight: 600;
  cursor: pointer;
}

/* ---- 합계 줄 (진단 색상) ---- */
.totline {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  padding: 11px 12px;
  border-radius: 12px;
  background: var(--chipbg);
  font-size: 15px;
  flex-wrap: wrap;
}
.totline span { flex: 1; font-weight: 700; min-width: 0; }
.totline b { font-variant-numeric: tabular-nums; }
.totline .pct { background: var(--card); }
.totline .pct-good { background: var(--pos); }
.totline .pct-bad { background: var(--neg); }
.totline-mid { background: transparent; border: 1px dashed var(--line-strong); padding: 8px 12px; font-size: 13.5px; }
.totline-mid span { font-weight: 500; }
.tot-good b { color: var(--pos); }
.tot-bad b { color: var(--neg); }

/* ---- 요약 행 ---- */
.sumrow {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 7px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14.5px;
}
.sumrow-label { flex: 1; min-width: 0; }
.sumrow-amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.won { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 1px; }
.sumrow-pct { min-width: 50px; text-align: right; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sumrow-strong { font-weight: 700; }
.sumrow-strong .sumrow-label { font-weight: 700; }
.rowgood .sumrow-amt, .rowgood .sumrow-pct { color: var(--pos); }
.rowbad .sumrow-amt, .rowbad .sumrow-pct { color: var(--neg); }
.profitline.pos .sumrow-amt, .profitline.pos .sumrow-pct { color: var(--pos); }
.profitline.neg .sumrow-amt, .profitline.neg .sumrow-pct { color: var(--neg); }

/* ---- 순이익 강조 ---- */
.finalprofit {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-top: 12px;
  padding: 18px 16px;
  border-radius: 14px;
  background: var(--chipbg);
  font-weight: 700;
  flex-wrap: wrap;
}
.finalprofit span { flex: 1; font-size: 17px; white-space: nowrap; }
.finalprofit b { font-size: 27px; font-variant-numeric: tabular-nums; }
.finalprofit i { font-style: normal; font-size: 15px; font-variant-numeric: tabular-nums; }
.finalprofit.pos b, .finalprofit.pos i { color: var(--pos); }
.finalprofit.neg b, .finalprofit.neg i { color: var(--neg); }

.foot {
  margin-top: 22px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  font-size: 12px;
  color: var(--muted);
  text-align: center;
}
.foot p { margin: 0 0 6px; }
.credit {
  margin-top: 10px !important;
  font-size: 14px;
  font-weight: 700;
  color: var(--ember);
  letter-spacing: 0.06em;
}

/* ---- 생성 파일 모달 ---- */
.modal-back {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(30, 22, 14, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
}
.modal {
  width: min(480px, 100%);
  max-height: 92vh;
  display: flex;
  flex-direction: column;
  background: var(--card);
  border-radius: 18px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  padding: 14px 16px 16px;
  overflow-y: auto;
}
.modal-head { display: flex; align-items: center; gap: 8px; }
.modal-head b { font-size: 15px; }
.modal-x {
  margin-left: auto;
  width: 34px; height: 34px;
  border: 1px solid var(--line-strong);
  border-radius: 9px;
  background: transparent;
  color: var(--muted);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
}
.modal-file {
  margin: 6px 0 8px;
  font-size: 12px;
  color: var(--muted);
  word-break: break-all;
}
.modal-imgwrap {
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  min-height: 120px;
  max-height: 46vh;
  flex: none;
}
.modal-imgwrap img { display: block; width: 100%; height: auto; }
.modal-tip { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); }
.modal-caution {
  margin: 8px 0 0;
  padding: 7px 10px;
  border-radius: 8px;
  background: var(--ember-soft);
  font-size: 12px;
  color: var(--ink);
}
.modal-btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.modal-btns .btn { flex: 1 1 auto; }

/* ---- 토스트 ---- */
.toast {
  position: fixed;
  left: 50%;
  bottom: 92px;
  transform: translateX(-50%);
  z-index: 300;
  max-width: min(92vw, 420px);
  padding: 11px 18px;
  border-radius: 999px;
  background: var(--stickybg);
  color: var(--stickyink);
  font-size: 13.5px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
  animation: toast-in 0.18s ease-out;
}
@keyframes toast-in {
  from { opacity: 0; transform: translateX(-50%) translateY(8px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .toast { animation: none; }
  .chev { transition: none; }
}

/* ---- 인쇄 (A4) ---- */
@media print {
  @page { size: A4; margin: 11mm; }
  body { background: #fff; color: #111; font-size: 9.5pt; }
  .no-print, .sticky, .toolbar, .savebar, .masthead, .toast, .addbtn, .del,
  .bottombar, .kakao-banner, .sample-banner, .legend { display: none !important; }
  .print-only { display: block; }
  .print-head { margin: 0 0 6mm; border-bottom: 2px solid #111; padding-bottom: 2mm; }
  .print-head h1 { margin: 0; font-size: 14pt; }
  .print-head p { margin: 1mm 0 0; font-size: 9.5pt; color: #444; }
  .wrap { max-width: none; padding: 0; }
  .card { border: 1px solid #bbb; border-radius: 0; box-shadow: none; margin: 0 0 3mm; break-inside: avoid; }
  .card-head { padding: 2.5mm 3mm 0; }
  .card-head h2 { font-size: 10.5pt; color: #111; }
  .card-head .sub, .emptymsg { display: none; }
  .stepnum { width: 5.5mm; height: 5.5mm; font-size: 8pt; background: #111; }
  .card-body { padding: 1.5mm 3mm 2.5mm; }
  input[type="text"], input[type="month"], .money, .storesel, .field textarea {
    border: 0; background: transparent; padding: 0.5mm 1mm; color: #111; font-size: 9.5pt;
  }
  .memo { border: 0; font-size: 8pt; color: #555; margin-top: 0; }
  .memo::placeholder, .namein::placeholder, .money::placeholder { color: transparent; }
  .matrow, .dynrow-plain { padding: 1mm 0; border-color: #ddd; }
  .dynrow { padding: 0.5mm 0; }
  .subhead { margin: 1.5mm 0 0.5mm; padding-top: 1mm; border-color: #ddd; }
  .totline { margin-top: 1.5mm; padding: 1.5mm 2mm; background: #f0f0f0; border-radius: 0; }
  .autoval { background: transparent; padding: 0.5mm 1mm; }
  .autodesc { color: #555; }
  .totline .pct, .pct { background: transparent; color: #444; padding: 0; }
  .pct-good { color: #0b4fb3; font-weight: 700; }
  .pct-bad { color: #b3271b; font-weight: 700; }
  .tot-good b { color: #0b4fb3; }
  .tot-bad b { color: #b3271b; }
  .diagbadge { border: 1px solid currentColor; background: transparent !important; }
  .diagbadge.good { color: #0b4fb3; }
  .diagbadge.danger { color: #b3271b; }
  .finalprofit { margin-top: 2mm; padding: 2.5mm 3mm; background: #f0f0f0; border-radius: 0; }
  .finalprofit b { font-size: 13pt; }
  .sumrow { padding: 1mm 0; border-color: #ddd; }
  .rowgood .sumrow-amt, .rowgood .sumrow-pct,
  .profitline.pos .sumrow-amt, .profitline.pos .sumrow-pct,
  .finalprofit.pos b, .finalprofit.pos i { color: #0b4fb3; }
  .rowbad .sumrow-amt, .rowbad .sumrow-pct,
  .profitline.neg .sumrow-amt, .profitline.neg .sumrow-pct,
  .finalprofit.neg b, .finalprofit.neg i { color: #b3271b; }
  .foot { margin-top: 3mm; padding-top: 2mm; color: #555; }
}

/* ===== 든든해장국밥 전용 오버라이드 ===== */
:root { --accent2: #a1352c; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --accent2: #cf7466; }
}
:root[data-theme="dark"] { --accent2: #cf7466; }

.logo-svg { color: var(--brand); width: 168px; }
.logo-word {
  font-family: "Black Han Sans", "IBM Plex Sans KR", sans-serif;
  font-size: 31px;
  letter-spacing: 0.03em;
  color: var(--brand);
}
.autodesc, .credit-top, .credit, .savechip.saving { color: var(--accent2); }
.addbtn { color: var(--accent2); }

/* 붉은 붓글씨 워드마크 */
.logo-word {
  font-family: "Nanum Brush Script", "IBM Plex Sans KR", cursive;
  font-size: 46px;
  letter-spacing: 0.01em;
  color: var(--brand);
  -webkit-text-stroke: 1.4px var(--brand);
  line-height: 1;
  margin-top: 2px;
}
.logo-svg { width: 172px; }

/* 실제 로고 이미지 헤더 */
.logo-img {
  display: block;
  margin: 0 auto;
  width: 250px;
  max-width: 82%;
  height: auto;
}
</style>

  /* ---------- 파일 전달 ---------- */
  async function saveBlob(blob, filename) {
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        const dl = await window.claude.use('downloads');
        if (dl) {
          try {
            await dl.save({ filename, data: blob });
            return 'saved';
          } catch (err) {
            if (err && err.code === 'declined') return 'declined';
            if (err && err.code === 'rate_limited') return 'failed';
          }
        }
      }
    } catch (e) { /* fall through */ }
    if (IS_KAKAO_INAPP) return 'failed';
    try {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 20000);
      return 'saved';
    } catch (e) { return 'failed'; }
  }

  async function shareBlob(blob, filename) {
    try {
      const file = new File([blob], filename, { type: blob.type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });
        return 'shared';
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return 'cancelled';
    }
    return 'unsupported';
  }

  async function copyPngToClipboard(blob) {
    try {
      if (navigator.clipboard && window.ClipboardItem) {
        await navigator.clipboard.write([new window.ClipboardItem({ 'image/png': blob })]);
        return true;
      }
    } catch (e) {}
    return false;
  }

  /* ---------- 캔버스 공통: 든든해장국밥 로고 (붉은색 붓 느낌) ---------- */
  const BRAND_INK = '#a1352c', ACCENT = '#a1352c';

  /* 실제 로고 이미지 (dd-logo.js에서 주입) — 없으면 그린 로고로 대체 */
  const LOGO_SRC = typeof window !== 'undefined' ? window.DDN_LOGO : null;
  const LOGO_RATIO = (window.DDN_LOGO_H || 641) / (window.DDN_LOGO_W || 1200);
  const logoImg = new Image();
  let logoReady = false;
  const logoLoaded = new Promise((resolve) => {
    if (!LOGO_SRC) { resolve(false); return; }
    logoImg.onload = () => { logoReady = true; resolve(true); };
    logoImg.onerror = () => resolve(false);
    logoImg.src = LOGO_SRC;
  });
  /* 캔버스에 로고 이미지를 그리고 실제 그린 높이를 반환 */
  function drawLogoImage(g, x, y, targetW, F) {
    if (logoReady) {
      const h = targetW * LOGO_RATIO;
      g.drawImage(logoImg, x, y, targetW, h);
      return h;
    }
    drawBrandLogo(g, x, y + 8, targetW / 480, F); /* 대체 그림 */
    return targetW / 480 * 120;
  }
  /* 붓글씨 워드마크: 채움 + 외곽선 겹치기로 굵기 보강 */
  function brushText(g, text, x, y, size, F) {
    g.font = F(400, Math.round(size), "'Nanum Brush Script'");
    g.fillStyle = BRAND_INK;
    g.strokeStyle = BRAND_INK;
    g.lineWidth = Math.max(1.5, size * 0.045);
    g.lineJoin = 'round';
    g.fillText(text, x, y);
    g.strokeText(text, x, y);
  }
  function drawBrandLogo(g, x, y, scale, F) {
    const s = scale;
    g.strokeStyle = BRAND_INK; g.fillStyle = BRAND_INK;
    g.lineCap = 'round'; g.lineJoin = 'round';
    /* 해(채움 원, 왼쪽 위) */
    g.beginPath(); g.arc(x + 24 * s, y + 6 * s, 8 * s, 0, Math.PI * 2); g.fill();
    /* 산 능선 (두 봉우리) */
    g.lineWidth = 4.5 * s;
    g.beginPath();
    g.moveTo(x, y + 52 * s);
    g.lineTo(x + 34 * s, y + 12 * s);
    g.lineTo(x + 50 * s, y + 30 * s);
    g.lineTo(x + 62 * s, y + 18 * s);
    g.lineTo(x + 74 * s, y + 32 * s);
    g.stroke();
    /* 달(고리, 오른쪽 위) */
    g.lineWidth = 3.5 * s;
    g.beginPath(); g.arc(x + 138 * s, y + 4 * s, 7.5 * s, 0, Math.PI * 2); g.stroke();
    /* 뚝배기 (오른쪽) */
    g.lineWidth = 4.5 * s;
    g.beginPath();
    g.ellipse(x + 108 * s, y + 36 * s, 24 * s, 7.5 * s, 0, 0, Math.PI * 2);
    g.stroke();
    g.beginPath();
    g.moveTo(x + 85 * s, y + 39 * s);
    g.quadraticCurveTo(x + 86 * s, y + 60 * s, x + 108 * s, y + 61 * s);
    g.quadraticCurveTo(x + 130 * s, y + 60 * s, x + 131 * s, y + 39 * s);
    g.stroke();
    /* 받침 */
    g.lineWidth = 3.5 * s;
    g.beginPath(); g.moveTo(x + 88 * s, y + 65 * s); g.lineTo(x + 128 * s, y + 65 * s); g.stroke();
    /* 김 3줄 */
    g.lineWidth = 2.8 * s;
    [[98, 0], [108, -5], [118, 0]].forEach(([dx, dy]) => {
      g.beginPath();
      g.moveTo(x + dx * s, y + (26 + dy) * s);
      g.bezierCurveTo(x + (dx - 5) * s, y + (18 + dy) * s, x + (dx + 5) * s, y + (12 + dy) * s, x + dx * s, y + (4 + dy) * s);
      g.stroke();
    });
    /* 温飯味酒 (왼쪽 아래) */
    g.font = F(700, Math.round(15 * s), 'serif');
    g.fillText('温飯味酒', x + 2 * s, y + 64 * s);
    /* 워드마크 (붓글씨, 오른쪽) */
    brushText(g, '든든해장국밥', x + 152 * s, y + 52 * s, 58 * s, F);
  }

  /* ============================================================
   * 카톡용 요약 PNG
   * ============================================================ */
  function drawSummaryPng(st, c) {
    const W = 1080, PAD = 64;
    const F = (w, s, fam) => `${w} ${s}px ${fam || "'IBM Plex Sans KR','Malgun Gothic',sans-serif"}`;

    const probe = document.createElement('canvas').getContext('2d');
    probe.font = F(400, 30);
    const wrap = (text, maxW) => {
      const out = [];
      for (const para of String(text || '').split('\n')) {
        let line = '';
        for (const ch of para) {
          if (probe.measureText(line + ch).width > maxW) { out.push(line); line = ch; }
          else line += ch;
        }
        out.push(line);
      }
      return out.slice(0, 6);
    };
    const memoLines = st.basic.memo ? wrap(st.basic.memo, W - PAD * 2 - 40) : [];

    const LOGO_W = 460;
    const logoH = Math.round(LOGO_W * LOGO_RATIO); /* ≈246 */
    const H = 1470 + logoH + (memoLines.length ? 100 + memoLines.length * 42 : 0);
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const g = cv.getContext('2d');

    g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
    const POS = '#1558bd', NEG = '#c62f22', INK = '#111111', MUT = '#666666', LINE = '#dddddd';
    const sales = st.basic.sales;

    const drawnH = drawLogoImage(g, (W - LOGO_W) / 2, 36, LOGO_W, F);
    let y = 36 + drawnH + 66;
    g.fillStyle = INK; g.font = F(700, 46);
    g.fillText('월간 손익 정산 요약', PAD, y);
    y += 50;
    g.fillStyle = MUT; g.font = F(400, 31);
    g.fillText(`${st.basic.store}  ·  ${ymKo(st.basic.month)}  ·  작성자 ${st.basic.author || '-'}`, PAD, y);
    y += 40;
    g.strokeStyle = BRAND_INK; g.lineWidth = 4;
    g.beginPath(); g.moveTo(PAD, y); g.lineTo(W - PAD, y); g.stroke();
    y += 72;

    const right = (txt, yy, font, color) => {
      g.font = font; g.fillStyle = color;
      g.fillText(txt, W - PAD - g.measureText(txt).width, yy);
    };
    const row = (label, amt, opt) => {
      const o = opt || {};
      const size = o.big ? 40 : 33;
      const color = o.grade === 'good' ? POS : o.grade === 'bad' ? NEG : (o.color || INK);
      g.font = F(o.bold || o.grade ? 700 : 400, size); g.fillStyle = color;
      g.fillText(label, PAD, y);
      if (o.grade) {
        const lw = g.measureText(label).width;
        g.font = F(700, 22);
        const tag = GRADE_LABEL[o.grade];
        const tw = g.measureText(tag).width;
        g.fillStyle = color;
        const bx = PAD + lw + 16, byTop = y - 24;
        g.beginPath();
        g.roundRect ? g.roundRect(bx, byTop, tw + 20, 32, 16) : g.rect(bx, byTop, tw + 20, 32);
        g.fill();
        g.fillStyle = '#fff';
        g.fillText(tag, bx + 10, y - 1);
      }
      const txt = `${fmt(amt)}원` + (o.noPct ? '' : `  ${pctStr(amt, sales)}`);
      right(txt, y, F(700, size), color);
      y += o.big ? 70 : 60;
    };

    row('총매출', sales, { bold: true, big: true, noPct: true, color: BRAND_INK });
    g.strokeStyle = LINE; g.lineWidth = 2;
    g.beginPath(); g.moveTo(PAD, y - 34); g.lineTo(W - PAD, y - 34); g.stroke();
    y += 6;
    row('재료비 합계', c.matTotal, { grade: gradeOf('mat', pctNum(c.matTotal, sales)) });
    row('인건비 합계', c.laborTotal, { grade: gradeOf('labor', pctNum(c.laborTotal, sales)) });
    row('임대료', st.rent, { grade: gradeOf('rent', pctNum(st.rent, sales)) });
    row('공과금 합계', c.utilTotal, { grade: gradeOf('util', pctNum(c.utilTotal, sales)) });
    row('기타 고정지출', c.fixedTotal, { grade: gradeOf('fixed', pctNum(c.fixedTotal, sales)) });
    row('기타비용', c.othersTotal, { grade: gradeOf('others', pctNum(c.othersTotal, sales)) });
    y += 6;
    g.strokeStyle = INK; g.lineWidth = 2;
    g.beginPath(); g.moveTo(PAD, y - 42); g.lineTo(W - PAD, y - 42); g.stroke();
    row('총지출', c.totalExpense, { bold: true });
    row('영업이익', c.profit, { bold: true, big: true, grade: gradeOf('profit', pctNum(c.profit, sales)) });
    row('부가세 (매출의 4%)', c.vat, {});
    row('소득세·법인세 (매출의 0.5%)', c.income, {});
    y += 12;

    const netGrade = gradeOf('net', pctNum(c.finalProfit, sales));
    const fColor = netGrade === 'bad' ? NEG : netGrade === 'good' ? POS : INK;
    g.fillStyle = '#f2efe9';
    g.fillRect(PAD - 10, y - 52, W - PAD * 2 + 20, 110);
    g.font = F(700, 40); g.fillStyle = INK;
    g.fillText('순이익', PAD + 14, y + 14);
    if (netGrade) {
      const tag = GRADE_LABEL[netGrade];
      g.font = F(700, 24);
      const tw = g.measureText(tag).width;
      g.fillStyle = fColor;
      const bx = PAD + 160, byTop = y - 14;
      g.beginPath();
      g.roundRect ? g.roundRect(bx, byTop, tw + 22, 34, 17) : g.rect(bx, byTop, tw + 22, 34);
      g.fill();
      g.fillStyle = '#fff'; g.fillText(tag, bx + 11, y + 11);
    }
    right(`${fmt(c.finalProfit)}원  ${pctStr(c.finalProfit, sales)}`, y + 14, F(700, 46), fColor);
    y += 122;

    if (memoLines.length) {
      g.font = F(700, 30); g.fillStyle = MUT;
      g.fillText('점주 메모', PAD, y); y += 46;
      g.font = F(400, 30); g.fillStyle = INK;
      for (const ln of memoLines) { g.fillText(ln, PAD, y); y += 42; }
      y += 10;
    }

    g.strokeStyle = LINE; g.lineWidth = 2;
    g.beginPath(); g.moveTo(PAD, y); g.lineTo(W - PAD, y); g.stroke();
    y += 44;
    g.font = F(400, 25); g.fillStyle = MUT;
    g.fillText(`작성일시: ${new Date().toLocaleString('ko-KR')}`, PAD, y); y += 38;
    g.fillText('파란색 GOOD = 기준 충족 · 빨간색 점검필요 = 기준 초과 항목', PAD, y); y += 38;
    g.fillText('본 정산서는 매장 경영관리용 간편 정산자료이며 세무신고용이 아닙니다.', PAD, y);
    right('Created by 맥형', y, F(700, 25), ACCENT);

    return new Promise((resolve) => cv.toBlob(resolve, 'image/png'));
  }

  /* ============================================================
   * 상세 PDF (A4 세로, 행 단위 페이지 넘김)
   * ============================================================ */
  function drawDetailPdf(st, c) {
    const W = 1240, H = 1754, PAD = 90, BOTTOM = 150;
    const F = (w, s, fam) => `${w} ${s}px ${fam || "'IBM Plex Sans KR','Malgun Gothic',sans-serif"}`;
    const INK = '#111', MUT = '#555', LINE = '#ccc';
    const POS = '#1558bd', NEG = '#c62f22';
    const sales = st.basic.sales;

    const pages = [];
    let g = null, y = 0;

    const newPage = () => {
      const cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      g = cv.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
      pages.push(cv);
      y = PAD;
      if (pages.length === 1) {
        const lw = 300;
        const lh = drawLogoImage(g, PAD, y - 14, lw, F); /* ≈160 */
        g.fillStyle = INK; g.font = F(700, 36);
        g.fillText('월간 손익 정산서 (상세)', PAD + lw + 40, y + 50);
        g.fillStyle = MUT; g.font = F(400, 24);
        g.fillText(`${st.basic.store}  ·  ${ymKo(st.basic.month)}  ·  작성자 ${st.basic.author || '-'}`, PAD + lw + 40, y + 88);
        y += Math.max(120, lh + 6);
        g.strokeStyle = BRAND_INK; g.lineWidth = 3;
        g.beginPath(); g.moveTo(PAD, y); g.lineTo(W - PAD, y); g.stroke();
        y += 44;
      } else {
        g.fillStyle = MUT; g.font = F(400, 22);
        g.fillText(`${st.basic.store} · ${ymKo(st.basic.month)} (계속)`, PAD, y + 10);
        y += 54;
      }
    };
    const ensure = (h) => { if (y + h > H - BOTTOM) newPage(); };
    const head = (title) => {
      ensure(120);
      y += 12;
      g.fillStyle = '#efece5';
      g.fillRect(PAD - 12, y - 26, W - PAD * 2 + 24, 40);
      g.fillStyle = BRAND_INK; g.font = F(700, 26);
      g.fillText(title, PAD, y + 3);
      y += 46;
    };
    const textLine = (txt, opt) => {
      const o = opt || {};
      ensure(36);
      g.font = F(o.bold ? 700 : 400, o.size || 22); g.fillStyle = o.color || MUT;
      g.fillText(txt, PAD + (o.indent ? 24 : 0), y);
      y += o.gap || 34;
    };
    const wrapLines = (text, font, maxW, maxLines) => {
      g.font = font;
      const out = [];
      for (const para of String(text || '').split('\n')) {
        let line = '';
        for (const ch of para) {
          if (g.measureText(line + ch).width > maxW) { out.push(line); line = ch; }
          else line += ch;
        }
        out.push(line);
      }
      return out.slice(0, maxLines || 12);
    };
    const fitLabel = (label, font, maxW) => {
      g.font = font;
      if (g.measureText(label).width <= maxW) return label;
      let s = String(label);
      while (s.length > 1 && g.measureText(s + '…').width > maxW) s = s.slice(0, -1);
      return s + '…';
    };
    const row2 = (labelIn, amt, opt) => {
      const o = opt || {};
      ensure(o.big ? 52 : 44);
      const size = o.big ? 30 : 24;
      const color = o.grade === 'good' ? POS : o.grade === 'bad' ? NEG : (o.color || INK);
      const labelFont = F(o.bold || o.grade ? 700 : 400, size);
      const labelMaxW = (W - PAD - 130 - 250) - (PAD + (o.indent ? 24 : 0)) - (o.grade ? 110 : 0);
      const label = fitLabel(labelIn, labelFont, labelMaxW);
      g.font = labelFont; g.fillStyle = color;
      g.fillText(label, PAD + (o.indent ? 24 : 0), y);
      if (o.grade) {
        const lw = g.measureText(label).width;
        const tag = GRADE_LABEL[o.grade];
        g.font = F(700, 17);
        const tw = g.measureText(tag).width;
        const bx = PAD + (o.indent ? 24 : 0) + lw + 12, byTop = y - 19;
        g.fillStyle = color;
        g.beginPath();
        g.roundRect ? g.roundRect(bx, byTop, tw + 16, 26, 13) : g.rect(bx, byTop, tw + 16, 26);
        g.fill();
        g.fillStyle = '#fff';
        g.fillText(tag, bx + 8, y);
      }
      const pctTxt = pctStr(amt, sales);
      g.font = F(o.grade ? 700 : 400, 20); g.fillStyle = o.grade ? color : MUT;
      g.fillText(pctTxt, W - PAD - g.measureText(pctTxt).width, y);
      const amtTxt = `${fmt(amt)}원`;
      g.font = F(o.bold || o.grade ? 700 : 600, size); g.fillStyle = color;
      g.fillText(amtTxt, W - PAD - 130 - g.measureText(amtTxt).width, y);
      y += 10;
      g.strokeStyle = LINE; g.lineWidth = 1;
      g.beginPath(); g.moveTo(PAD, y); g.lineTo(W - PAD, y); g.stroke();
      y += o.big ? 40 : 32;
    };

    newPage();

    head('기본 정보');
    row2('총매출', sales, { bold: true, big: true, color: BRAND_INK });
    if (st.basic.memo) {
      textLine('점주 메모:', { bold: true });
      for (const ln of wrapLines(st.basic.memo, F(400, 22), W - PAD * 2 - 24, 10)) {
        textLine(ln, { indent: true, color: INK });
      }
      y += 6;
    }

    head('재료비');
    for (const [k, name, desc] of MAT_DEFS) {
      row2(`${name} (${desc})`, st.mat[k].amt, { indent: true });
      if (st.mat[k].memo) {
        for (const ln of wrapLines('· ' + st.mat[k].memo, F(400, 19), W - PAD * 2 - 60, 3)) {
          ensure(28);
          g.font = F(400, 19); g.fillStyle = MUT;
          g.fillText(ln, PAD + 48, y - 6);
          y += 26;
        }
        y += 2;
      }
    }
    for (const r of st.mat.extras) row2(`기타 사입 — ${r.name || '이름 없음'}`, r.amt, { indent: true });
    row2('재료비 합계', c.matTotal, { grade: gradeOf('mat', pctNum(c.matTotal, sales)) });

    head('인건비');
    for (const [type, label, , subLabel] of LABOR_DEFS) {
      for (const r of st.labor[type]) row2(`${label} — ${r.name || '이름 없음'}`, r.amt, { indent: true });
      row2(subLabel, c.subTotals[type], { bold: true });
    }
    row2('인건비 합계', c.laborTotal, { grade: gradeOf('labor', pctNum(c.laborTotal, sales)) });

    head('임대료');
    row2('월 임대료', st.rent, { grade: gradeOf('rent', pctNum(st.rent, sales)) });

    head('공과금');
    row2('전기요금', st.util.elec, { indent: true });
    row2('가스요금', st.util.gas, { indent: true });
    row2('수도요금', st.util.water, { indent: true });
    row2('공과금 합계', c.utilTotal, { grade: gradeOf('util', pctNum(c.utilTotal, sales)) });

    head('기타 고정 지출');
    row2('마케팅비', st.fixedCost.mkt, { indent: true });
    row2('카드수수료 (매출의 1.1% 자동)', c.card, { indent: true });
    row2('기타 고정 지출 합계', c.fixedTotal, { grade: gradeOf('fixed', pctNum(c.fixedTotal, sales)) });

    head('기타비용');
    row2('세무기장료', st.othersFixed.taxsvc, { indent: true });
    row2('수리유지비', st.othersFixed.repair, { indent: true });
    for (const r of st.others) row2(r.name || '이름 없음', r.amt, { indent: true });
    row2('기타비용 합계', c.othersTotal, { grade: gradeOf('others', pctNum(c.othersTotal, sales)) });

    head('손익 요약');
    row2('총매출', sales, { bold: true, color: BRAND_INK });
    row2('총지출', c.totalExpense, { bold: true });
    row2('영업이익', c.profit, { big: true, grade: gradeOf('profit', pctNum(c.profit, sales)) });
    row2('부가세 (매출의 4%)', c.vat, {});
    row2('소득세·법인세 (매출의 0.5%)', c.income, {});
    row2('순이익', c.finalProfit, { big: true, grade: gradeOf('net', pctNum(c.finalProfit, sales)) });

    ensure(160);
    y += 10;
    textLine('진단 표기: 파란색 GOOD = 기준 충족 · 빨간색 점검필요 = 기준 초과', { bold: true, color: INK });
    textLine(`작성일시: ${new Date().toLocaleString('ko-KR')}`);
    textLine('본 정산서는 든든해장국밥 매장 경영관리를 위한 간편 정산자료이며 세무신고용 손익계산서가 아닙니다.');
    textLine('실제 납부세액은 매입세액, 사업자 형태 및 세무조정에 따라 달라집니다.');
    textLine('Created by 맥형', { bold: true, color: ACCENT });

    pages.forEach((cv, i) => {
      const ctx = cv.getContext('2d');
      ctx.font = F(400, 20); ctx.fillStyle = MUT;
      const t = `${i + 1} / ${pages.length}`;
      ctx.fillText(t, W / 2 - ctx.measureText(t).width / 2, H - 60);
    });

    const jpegs = pages.map((cv) => {
      const dataUrl = cv.toDataURL('image/jpeg', 0.92);
      const b64 = dataUrl.slice(dataUrl.indexOf(',') + 1);
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    });
    return buildPdf(jpegs, W, H);
  }

  function buildPdf(jpegs, wPx, hPx) {
    const Wp = 595.28, Hp = 841.89;
    const enc = new TextEncoder();
    const chunks = [];
    let offset = 0;
    const offsets = [];
    const push = (d) => {
      const b = typeof d === 'string' ? enc.encode(d) : d;
      chunks.push(b); offset += b.length;
    };
    const addObj = (num, body) => { offsets[num] = offset; push(`${num} 0 obj\n${body}\nendobj\n`); };

    const n = jpegs.length;
    push('%PDF-1.4\n');
    const kids = Array.from({ length: n }, (_, i) => `${3 + i * 3} 0 R`).join(' ');
    addObj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    addObj(2, `<< /Type /Pages /Kids [${kids}] /Count ${n} >>`);
    jpegs.forEach((jpeg, i) => {
      const pageN = 3 + i * 3, imgN = 4 + i * 3, contN = 5 + i * 3;
      addObj(pageN,
        `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${Wp} ${Hp}] ` +
        `/Resources << /XObject << /Im${i} ${imgN} 0 R >> >> /Contents ${contN} 0 R >>`);
      offsets[imgN] = offset;
      push(`${imgN} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${wPx} /Height ${hPx} ` +
        `/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);
      push(jpeg);
      push('\nendstream\nendobj\n');
      const content = `q ${Wp} 0 0 ${Hp} 0 0 cm /Im${i} Do Q`;
      addObj(contN, `<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
    });
    const xrefStart = offset;
    const total = 3 + n * 3;
    let xref = `xref\n0 ${total}\n0000000000 65535 f \n`;
    for (let i = 1; i < total; i++) xref += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
    push(xref);
    push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`);
    return new Blob(chunks, { type: 'application/pdf' });
  }

  /* ---------- 작은 컴포넌트 ---------- */
  function MoneyInput({ value, onChange, ariaLabel, bold }) {
    return html`<input
      className=${'money' + (bold ? ' money-bold' : '')}
      type="text" inputMode="numeric" autoComplete="off"
      aria-label=${ariaLabel || '금액'} placeholder="0"
      value=${value ? fmt(value) : ''}
      onChange=${(e) => onChange(parseAmt(e.target.value))}
    />`;
  }
  function Pct({ amt, sales, grade }) {
    return html`<span className=${'pct' + (grade ? ' pct-' + grade : '')}>${pctStr(amt, sales)}</span>`;
  }
  function Badge({ grade }) {
    if (!grade) return null;
    return html`<span className=${'diagbadge ' + (grade === 'good' ? 'good' : 'danger')}>${GRADE_LABEL[grade]}</span>`;
  }
  function Section({ num, title, sub, children }) {
    return html`<section className="card">
      <header className="card-head">
        <span className="stepnum" aria-hidden="true">${num}</span>
        <div className="card-head-text">
          <h2>${title}</h2>
          ${sub ? html`<p className="sub">${sub}</p>` : null}
        </div>
      </header>
      <div className="card-body">${children}</div>
    </section>`;
  }
  function SumRow({ label, amt, sales, strong, cls, grade }) {
    const gCls = grade === 'good' ? ' rowgood' : grade === 'bad' ? ' rowbad' : '';
    return html`<div className=${'sumrow' + (strong ? ' sumrow-strong' : '') + (cls ? ' ' + cls : '') + gCls}>
      <span className="sumrow-label">${label}<${Badge} grade=${grade} /></span>
      <span className="sumrow-amt">${fmt(amt)}<span className="won">원</span></span>
      <span className="sumrow-pct">${pctStr(amt, sales)}</span>
    </div>`;
  }

  /* ---------- 앱 ---------- */
  function App() {
    const [st, setSt] = useState(emptyState);
    const [sampleMode, setSampleMode] = useState(false);
    const [saveStatus, setSaveStatus] = useState('idle');
    const [savedList, setSavedList] = useState(listSaved);
    const [toast, setToast] = useState(null);
    const [expanded, setExpanded] = useState(false);
    const [modal, setModal] = useState(null);
    const [busy, setBusy] = useState(false);
    const toastTimer = useRef(null);
    const saveTimer = useRef(null);
    const stRef = useRef(st); stRef.current = st;
    const sampleRef = useRef(sampleMode); sampleRef.current = sampleMode;
    const currentKeyRef = useRef(null);
    const skipSaveRef = useRef(false);

    const say = (msg) => {
      setToast(msg);
      if (toastTimer.current) clearTimeout(toastTimer.current);
      toastTimer.current = setTimeout(() => setToast(null), 3400);
    };

    /* ---- 계산 (로열티 없음 / 부가세 4%) ---- */
    const sales = st.basic.sales;
    const c = useMemo(() => {
      const matFixed = MAT_DEFS.reduce((a, [k]) => a + st.mat[k].amt, 0);
      const matExtras = st.mat.extras.reduce((a, r) => a + r.amt, 0);
      const matTotal = matFixed + matExtras;
      const subTotals = {};
      LABOR_DEFS.forEach(([type]) => {
        subTotals[type] = st.labor[type].reduce((a, r) => a + r.amt, 0);
      });
      const laborTotal = LABOR_DEFS.reduce((a, [type]) => a + subTotals[type], 0);
      const utilTotal = st.util.elec + st.util.gas + st.util.water;
      const card = Math.round(sales * CARD_RATE);
      const vat = Math.round(sales * VAT_RATE);
      const income = Math.round(sales * INC_RATE);
      const fixedTotal = st.fixedCost.mkt + card;
      const othersTotal = st.othersFixed.taxsvc + st.othersFixed.repair
        + st.others.reduce((a, r) => a + r.amt, 0);
      const totalExpense = matTotal + laborTotal + st.rent + utilTotal + fixedTotal + othersTotal;
      const profit = sales - totalExpense;
      const finalProfit = profit - vat - income;
      return { matTotal, subTotals, laborTotal, utilTotal, card, vat, income, fixedTotal, othersTotal, totalExpense, profit, finalProfit };
    }, [st]);
    const cRef = useRef(c); cRef.current = c;

    const grades = {
      mat: gradeOf('mat', pctNum(c.matTotal, sales)),
      labor: gradeOf('labor', pctNum(c.laborTotal, sales)),
      rent: gradeOf('rent', pctNum(st.rent, sales)),
      util: gradeOf('util', pctNum(c.utilTotal, sales)),
      fixed: gradeOf('fixed', pctNum(c.fixedTotal, sales)),
      others: gradeOf('others', pctNum(c.othersTotal, sales)),
      profit: gradeOf('profit', pctNum(c.profit, sales)),
      net: gradeOf('net', pctNum(c.finalProfit, sales)),
    };

    /* ---- 자동저장 (1초 디바운스) ---- */
    useEffect(() => {
      if (skipSaveRef.current) { skipSaveRef.current = false; return; }
      if (sampleMode) { setSaveStatus('sample'); return; }
      const store = st.basic.store.trim();
      const ym = st.basic.month;
      if (!store || !ym) { setSaveStatus('nokey'); return; }
      setSaveStatus('saving');
      if (saveTimer.current) clearTimeout(saveTimer.current);
      saveTimer.current = setTimeout(() => {
        try {
          const key = keyOf(store, ym);
          localStorage.setItem(key, JSON.stringify({ savedAt: Date.now(), data: stRef.current }));
          localStorage.setItem(LAST_KEY, key);
          currentKeyRef.current = key;
          setSaveStatus('saved');
          setSavedList(listSaved());
        } catch (e) {
          setSaveStatus('error');
        }
      }, 1000);
      return () => { if (saveTimer.current) clearTimeout(saveTimer.current); };
    }, [st, sampleMode]);

    /* ---- 최초 접속: 같은 기기에서 마지막 자료 복원 (자동저장 effect 뒤에 선언) ---- */
    useEffect(() => {
      try {
        const last = localStorage.getItem(LAST_KEY);
        if (last) {
          const raw = localStorage.getItem(last);
          if (raw) {
            const parsed = JSON.parse(raw);
            skipSaveRef.current = true;
            setSt(hydrate(parsed.data));
            currentKeyRef.current = last;
            setSaveStatus('saved');
          }
        }
      } catch (e) {}
    }, []);

    /* ---- 문서 전환 ---- */
    const flushNow = () => {
      if (saveTimer.current) { clearTimeout(saveTimer.current); saveTimer.current = null; }
      if (sampleRef.current) return;
      const s = stRef.current;
      const store = s.basic.store.trim();
      if (!store || !s.basic.month) return;
      try {
        const key = keyOf(store, s.basic.month);
        localStorage.setItem(key, JSON.stringify({ savedAt: Date.now(), data: s }));
        currentKeyRef.current = key;
      } catch (e) {}
    };

    const switchDoc = (newStore, newYm, msgWhenNew) => {
      const fromSample = sampleRef.current;
      flushNow();
      const key = newStore.trim() && newYm ? keyOf(newStore, newYm) : null;
      let loaded = null;
      if (key) { try { loaded = JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) {} }
      if (loaded && loaded.data) {
        skipSaveRef.current = true;
        const next = hydrate(loaded.data);
        next.basic.store = newStore;
        next.basic.month = newYm;
        setSt(next);
        currentKeyRef.current = key;
        try { localStorage.setItem(LAST_KEY, key); } catch (e) {}
        setSaveStatus('saved');
        say('저장자료를 불러왔습니다');
      } else {
        const next = emptyState();
        next.basic.store = newStore;
        next.basic.author = fromSample ? '' : stRef.current.basic.author;
        next.basic.month = newYm;
        setSt(next);
        currentKeyRef.current = key;
        if (msgWhenNew) say(msgWhenNew);
      }
      setSampleMode(false);
    };

    const changeMonth = (newYm) => {
      if (newYm === st.basic.month) return;
      if (!newYm) {
        flushNow();
        setSt((p) => ({ ...p, basic: { ...p.basic, month: '' } }));
        return;
      }
      const store = sampleRef.current ? STORE_LIST[0] : st.basic.store;
      switchDoc(store, newYm, `${ymKo(newYm)} 새 정산서를 시작합니다`);
    };

    const changeStore = (newStore) => {
      if (newStore === st.basic.store) return;
      if (!newStore) {
        flushNow();
        setSt((p) => ({ ...p, basic: { ...p.basic, store: '' } }));
        return;
      }
      const ym = sampleRef.current ? '' : st.basic.month;
      switchDoc(newStore, ym, `${newStore} 정산서를 시작합니다`);
    };

    const loadSavedKey = (key) => {
      if (!key) return;
      flushNow();
      try {
        const parsed = JSON.parse(localStorage.getItem(key) || 'null');
        if (!parsed || !parsed.data) { say('저장자료를 읽지 못했습니다'); return; }
        skipSaveRef.current = true;
        setSt(hydrate(parsed.data));
        currentKeyRef.current = key;
        localStorage.setItem(LAST_KEY, key);
        setSampleMode(false);
        setSaveStatus('saved');
        say('저장자료를 불러왔습니다');
        window.scrollTo({ top: 0 });
      } catch (e) { say('불러오기에 실패했습니다'); }
    };

    /* ---- 버튼 동작 ---- */
    const doSample = () => {
      flushNow();
      skipSaveRef.current = true;
      setSt(sampleState());
      setSampleMode(true);
      setSaveStatus('sample');
      say('예시자료를 불러왔습니다 — 실제 자료가 아니며 저장되지 않습니다');
      window.scrollTo({ top: 0 });
    };

    const exitSample = () => {
      skipSaveRef.current = true;
      setSt(emptyState());
      setSampleMode(false);
      currentKeyRef.current = null;
      setSaveStatus('idle');
    };

    const doReset = () => {
      const store = st.basic.store.trim() || '(지점 미선택)';
      const ymTxt = ymKo(st.basic.month) || '(정산연월 없음)';
      const ok = window.confirm(
        `'${store} / ${ymTxt}' 정산자료를 삭제하고 화면을 비웁니다.\n` +
        `다른 월의 저장자료는 그대로 유지됩니다.\n` +
        `삭제하면 복구할 수 없습니다. 계속할까요?`,
      );
      if (!ok) return;
      if (saveTimer.current) { clearTimeout(saveTimer.current); saveTimer.current = null; }
      try {
        if (st.basic.store.trim() && st.basic.month) {
          localStorage.removeItem(keyOf(st.basic.store, st.basic.month));
        }
        if (currentKeyRef.current) {
          try { if (localStorage.getItem(LAST_KEY) === currentKeyRef.current) localStorage.removeItem(LAST_KEY); } catch (e) {}
        }
      } catch (e) {}
      skipSaveRef.current = true;
      const next = emptyState();
      next.basic.store = st.basic.store;
      next.basic.month = st.basic.month;
      next.basic.author = st.basic.author;
      setSt(next);
      setSampleMode(false);
      setSaveStatus('idle');
      setSavedList(listSaved());
      say('현재 정산서를 초기화했습니다');
      window.scrollTo({ top: 0 });
    };

    const requireBasics = () => {
      if (!st.basic.store.trim() || !st.basic.month) {
        say('지점과 정산연월을 먼저 선택해 주세요');
        window.scrollTo({ top: 0 });
        return false;
      }
      return true;
    };

    const makePng = async () => {
      if (!requireBasics() || busy) return;
      setBusy(true);
      try {
        try { await document.fonts.ready; } catch (e) {}
        try { await logoLoaded; } catch (e) {}
        const blob = await drawSummaryPng(stRef.current, cRef.current);
        const filename = fileBase(st.basic.store, st.basic.month) + '_요약.png';
        setModal({ kind: 'png', url: URL.createObjectURL(blob), blob, filename });
      } catch (e) {
        say('이미지 생성에 실패했습니다');
      } finally { setBusy(false); }
    };

    const makePdf = async () => {
      if (!requireBasics() || busy) return;
      setBusy(true);
      try {
        try { await document.fonts.ready; } catch (e) {}
        try { await logoLoaded; } catch (e) {}
        const blob = drawDetailPdf(stRef.current, cRef.current);
        const filename = fileBase(st.basic.store, st.basic.month) + '_상세.pdf';
        setModal({ kind: 'pdf', url: null, blob, filename });
      } catch (e) {
        say('PDF 생성에 실패했습니다');
      } finally { setBusy(false); }
    };

    const closeModal = () => {
      if (modal && modal.url) { try { URL.revokeObjectURL(modal.url); } catch (e) {} }
      setModal(null);
    };

    const failGuide = (kind) => {
      if (IS_KAKAO_INAPP) {
        say('카카오톡 안 브라우저에서는 저장이 막혀 있습니다. [크롬·사파리로 열기]를 눌러 주세요.');
      } else if (kind === 'png') {
        say('저장에 실패했습니다. 이미지를 길게 눌러 저장해 보세요.');
      } else {
        say('저장에 실패했습니다. [인쇄하기]에서 PDF로 저장을 이용해 보세요.');
      }
    };

    const doShare = async () => {
      if (!modal) return;
      const r = await shareBlob(modal.blob, modal.filename);
      if (r === 'shared') { say('공유창을 열었습니다. 카카오톡을 선택해 주세요'); return; }
      if (r === 'cancelled') return;
      const s = await saveBlob(modal.blob, modal.filename);
      if (s === 'saved') say(modal.kind === 'png'
        ? '이미지가 저장되었습니다. 카카오톡에서 사진 첨부로 올려주세요.'
        : 'PDF가 저장되었습니다. 카카오톡에서 파일 첨부로 올려주세요.');
      else if (s === 'declined') say('저장을 취소했습니다');
      else failGuide(modal.kind);
    };

    const doDownload = async () => {
      if (!modal) return;
      const s = await saveBlob(modal.blob, modal.filename);
      if (s === 'saved') say(modal.kind === 'png'
        ? '이미지가 저장되었습니다. 카카오톡에서 사진 첨부로 올려주세요.'
        : 'PDF가 저장되었습니다. 카카오톡에서 파일 첨부로 올려주세요.');
      else if (s === 'declined') say('저장을 취소했습니다');
      else failGuide(modal.kind);
    };

    const doCopyImage = async () => {
      if (!modal || modal.kind !== 'png') return;
      const ok = await copyPngToClipboard(modal.blob);
      if (ok) say('이미지를 복사했습니다. 카카오톡 채팅창에 붙여넣기(Ctrl+V) 하세요.');
      else say('이미지 복사가 지원되지 않는 브라우저입니다. [파일로 저장]을 이용해 주세요.');
    };

    const doPrint = () => window.print();

    /* ---- 입력 업데이트 ---- */
    const up = (fn) => setSt((prev) => { const next = JSON.parse(JSON.stringify(prev)); fn(next); return next; });

    const matRow = (key, name, desc) => html`<div className="matrow" key=${key}>
      <div className="matrow-top">
        <div className="matrow-name"><b>${name}</b><span className="desc">${desc}</span></div>
        <${MoneyInput} value=${st.mat[key].amt} ariaLabel=${name + ' 금액'}
          onChange=${(v) => up((s) => { s.mat[key].amt = v; })} />
        <${Pct} amt=${st.mat[key].amt} sales=${sales} />
      </div>
      <input className="memo" type="text" maxLength="60" placeholder="메모 (예: 발주 내용, 특이사항)"
        aria-label=${name + ' 메모'} value=${st.mat[key].memo}
        onChange=${(e) => up((s) => { s.mat[key].memo = e.target.value; })} />
    </div>`;

    const dynRow = (row, namePh, onName, onAmt, onDel) => html`<div className="dynrow" key=${row.id}>
      <input className="namein" type="text" maxLength="30" placeholder=${namePh}
        aria-label="항목명" value=${row.name} onChange=${(e) => onName(e.target.value)} />
      <${MoneyInput} value=${row.amt} onChange=${onAmt} ariaLabel=${(row.name || namePh) + ' 금액'} />
      <${Pct} amt=${row.amt} sales=${sales} />
      <button type="button" className="del" aria-label="이 줄 삭제" title="삭제" onClick=${onDel}>×</button>
    </div>`;

    const autoRow = (label, desc, amt) => html`<div className="dynrow dynrow-plain">
      <span className="fixname">${label}<span className="desc autodesc">${desc}</span></span>
      <span className="autoval">${fmt(amt)}<span className="won">원</span></span>
      <${Pct} amt=${amt} sales=${sales} />
    </div>`;

    const totLine = (label, amt, grade, mid) => html`<div className=${'totline' + (mid ? ' totline-mid' : '') + (grade ? ' tot-' + grade : '')}>
      <span>${label}<${Badge} grade=${grade} /></span>
      <b>${fmt(amt)}원</b>
      <${Pct} amt=${amt} sales=${sales} grade=${grade} />
    </div>`;

    const laborGroup = (type, label, btnLabel, subLabel) => html`<div key=${type}>
      <div className="subhead"><b>${label}</b></div>
      ${st.labor[type].length === 0 ? html`<p className="emptymsg">아래 버튼으로 추가해 주세요.</p>` : null}
      ${st.labor[type].map((row, i) => dynRow(row, label + ' 이름',
        (v) => up((s) => { s.labor[type][i].name = v; }),
        (v) => up((s) => { s.labor[type][i].amt = v; }),
        () => up((s) => { s.labor[type].splice(i, 1); })))}
      <button type="button" className="addbtn no-print" onClick=${() => up((s) => {
        s.labor[type].push({ id: newId(), name: LABOR_BASENAME[type] + (s.labor[type].length + 1), amt: 0 });
      })}>${btnLabel}</button>
      ${totLine(subLabel, c.subTotals[type], null, true)}
    </div>`;

    const statusChip = () => {
      switch (saveStatus) {
        case 'saving': return html`<span className="savechip saving">저장 중…</span>`;
        case 'saved': return html`<span className="savechip saved">저장 완료</span>`;
        case 'error': return html`<span className="savechip error">저장 실패 — 브라우저 저장공간을 확인하세요</span>`;
        case 'sample': return html`<span className="savechip sample">예시자료 — 저장되지 않습니다</span>`;
        case 'nokey': return html`<span className="savechip">지점·정산연월을 선택하면 자동저장됩니다</span>`;
        default: return html`<span className="savechip">자동저장 대기</span>`;
      }
    };

    const summaryRows = html`
      <${SumRow} key="s1" label="총매출" amt=${sales} sales=${sales} strong=${true} />
      <${SumRow} key="s2" label="재료비" amt=${c.matTotal} sales=${sales} grade=${grades.mat} />
      <${SumRow} key="s3" label="인건비" amt=${c.laborTotal} sales=${sales} grade=${grades.labor} />
      <${SumRow} key="s4" label="임대료" amt=${st.rent} sales=${sales} grade=${grades.rent} />
      <${SumRow} key="s5" label="공과금" amt=${c.utilTotal} sales=${sales} grade=${grades.util} />
      <${SumRow} key="s6" label="기타 고정지출" amt=${c.fixedTotal} sales=${sales} grade=${grades.fixed} />
      <${SumRow} key="s7" label="기타비용" amt=${c.othersTotal} sales=${sales} grade=${grades.others} />
      <${SumRow} key="s8" label="총지출" amt=${c.totalExpense} sales=${sales} strong=${true} />
      <${SumRow} key="s9" label="영업이익" amt=${c.profit} sales=${sales} strong=${true} grade=${grades.profit} cls="profitline" />`;

    const signCls = (n) => (n > 0 ? 'pos' : n < 0 ? 'neg' : '');
    const storeOptions = STORE_LIST.slice();
    if (st.basic.store && !storeOptions.includes(st.basic.store)) storeOptions.push(st.basic.store);

    return html`<div className="wrap">

      <!-- 앱 헤더 (든든해장국밥 로고) -->
      <header className="masthead">
        ${LOGO_SRC
          ? html`<img className="logo-img" src=${LOGO_SRC} alt="든든해장국밥" />`
          : html`<${LogoSvg} /><p className="logo-word">든든해장국밥</p>`}
        <h1>월간 손익 정산서</h1>
        <p className="credit-top">Created by 맥형</p>
      </header>

      ${IS_KAKAO_INAPP ? html`<div className="kakao-banner no-print" role="note">
        📱 카카오톡으로 여셨네요! 이미지·PDF 저장이 잘 되도록
        <b> 크롬·사파리에서 여는 것을 권장</b>합니다.
        <button type="button" className="sample-exit" onClick=${openExternalBrowser}>크롬·사파리로 열기</button>
      </div>` : null}

      ${sampleMode ? html`<div className="sample-banner no-print" role="alert">
        ⚠️ <b>예시자료</b>입니다 — 실제 정산자료가 아니며 자동저장되지 않습니다.
        <button type="button" className="sample-exit" onClick=${exitSample}>예시 지우고 새로 쓰기</button>
      </div>` : null}

      <!-- 상단 고정 요약 -->
      <div className="sticky no-print">
        <button type="button" className="sticky-main" onClick=${() => setExpanded(!expanded)}
          aria-expanded=${expanded} aria-label="손익 요약 자세히 보기">
          <span className="sk"><em>총매출</em><b>${fmt(sales)}</b></span>
          <span className="sk"><em>총지출</em><b>${fmt(c.totalExpense)}</b></span>
          <span className=${'sk sk-profit ' + signCls(c.profit)}>
            <em>영업이익</em><b>${fmt(c.profit)}</b><i>${pctStr(c.profit, sales)}</i>
          </span>
          <span className=${'chev' + (expanded ? ' open' : '')} aria-hidden="true">▾</span>
        </button>
        ${expanded ? html`<div className="sticky-detail">
          ${summaryRows}
          <div className=${'sumrow sumrow-strong profitline ' + signCls(c.finalProfit)}>
            <span className="sumrow-label">순이익<${Badge} grade=${grades.net} /></span>
            <span className="sumrow-amt">${fmt(c.finalProfit)}<span className="won">원</span></span>
            <span className="sumrow-pct">${pctStr(c.finalProfit, sales)}</span>
          </div>
        </div>` : null}
      </div>

      <!-- 인쇄 전용 머리글 -->
      <div className="print-head print-only">
        <h1>든든해장국밥 월간 손익 정산서</h1>
        <p>${st.basic.store || '지점 미선택'} · ${ymKo(st.basic.month) || '정산연월 미선택'} · 작성자: ${st.basic.author || '-'}</p>
      </div>

      <!-- 관리 버튼 + 저장 상태 -->
      <div className="toolbar no-print" role="toolbar" aria-label="정산서 도구">
        <button type="button" className="btn" onClick=${doSample}>예시자료</button>
        <button type="button" className="btn" onClick=${doPrint}>인쇄하기</button>
        <button type="button" className="btn btn-danger" onClick=${doReset}>초기화</button>
        ${savedList.length ? html`<select className="savedsel" aria-label="저장된 정산월 불러오기"
          value="" onChange=${(e) => { loadSavedKey(e.target.value); e.target.value = ''; }}>
          <option value="" disabled>지난 정산월 (${savedList.length})</option>
          ${savedList.map((it) => html`<option key=${it.key} value=${it.key}>
            ${it.store} · ${ymKo(it.ym)}
          </option>`)}
        </select>` : null}
      </div>
      <div className="savebar no-print">
        ${statusChip()}
        <span className="privacy-mini">🔒 자료는 이 기기에만 저장 · 서버 전송 없음 · 시크릿모드는 저장 유지 안 됨</span>
      </div>

      <!-- 1. 기본 정보 -->
      <${Section} num="1" title="기본 정보" sub="정산연월을 선택하면 자동저장이 시작됩니다.">
        <div className="basicgrid">
          <label className="field">
            <span>매장명 <em className="req">필수</em></span>
            <select className=${'storesel' + (!st.basic.store ? ' need' : '')} value=${st.basic.store}
              onChange=${(e) => changeStore(e.target.value)}>
              ${storeOptions.map((n) => html`<option key=${n} value=${n}>${n}</option>`)}
            </select>
          </label>
          <label className="field">
            <span>정산연월 <em className="req">필수</em></span>
            <input type="month" value=${st.basic.month}
              className=${!st.basic.month ? 'need' : ''}
              onChange=${(e) => changeMonth(e.target.value)} />
          </label>
          <label className="field">
            <span>작성자명</span>
            <input type="text" maxLength="20" placeholder="이름"
              value=${st.basic.author} onChange=${(e) => up((s) => { s.basic.author = e.target.value; })} />
          </label>
          <label className="field field-sales">
            <span>이번 달 총매출 (원)</span>
            <${MoneyInput} value=${sales} bold=${true} ariaLabel="총매출"
              onChange=${(v) => up((s) => { s.basic.sales = v; })} />
          </label>
          <label className="field field-memo">
            <span>점주 메모</span>
            <textarea rows="2" maxLength="500" placeholder="이번 달 특이사항 (요약 이미지에 함께 표시됩니다)"
              value=${st.basic.memo}
              onChange=${(e) => up((s) => { s.basic.memo = e.target.value; })}></textarea>
          </label>
        </div>
        <p className="hint">금액은 모두 원 단위이며, 비워 두면 0원으로 계산됩니다.</p>
      <//>

      <!-- 2. 재료비 -->
      <${Section} num="2" title="재료비" sub="공급처별 결제 금액을 넣어 주세요.">
        ${MAT_DEFS.map(([k, name, desc]) => matRow(k, name, desc))}
        <div className="subhead"><b>기타 사입</b><span className="desc">시장·마트 등에서 직접 산 재료</span></div>
        ${st.mat.extras.map((row, i) => dynRow(row, '항목명 또는 거래처명',
          (v) => up((s) => { s.mat.extras[i].name = v; }),
          (v) => up((s) => { s.mat.extras[i].amt = v; }),
          () => up((s) => { s.mat.extras.splice(i, 1); })))}
        <button type="button" className="addbtn no-print" onClick=${() => up((s) => { s.mat.extras.push({ id: newId(), name: '', amt: 0 }); })}>+ 기타 사입 추가</button>
        ${totLine('재료비 합계', c.matTotal, grades.mat)}
      <//>

      <!-- 3. 인건비 -->
      <${Section} num="3" title="인건비" sub="직원·아르바이트·파출·인센티브를 나누어 입력합니다.">
        ${LABOR_DEFS.map(([type, label, btnLabel, subLabel]) => laborGroup(type, label, btnLabel, subLabel))}
        ${totLine('인건비 합계', c.laborTotal, grades.labor)}
        <p className="hint">카톡용 요약 이미지에는 개인별 이름·급여는 나오지 않고 합계만 표시됩니다.</p>
      <//>

      <!-- 4. 임대료 -->
      <${Section} num="4" title="임대료">
        <div className="dynrow dynrow-plain">
          <span className="fixname">월 임대료<${Badge} grade=${grades.rent} /></span>
          <${MoneyInput} value=${st.rent} ariaLabel="월 임대료" onChange=${(v) => up((s) => { s.rent = v; })} />
          <${Pct} amt=${st.rent} sales=${sales} grade=${grades.rent} />
        </div>
      <//>

      <!-- 5. 공과금 -->
      <${Section} num="5" title="공과금">
        ${[['elec', '전기요금'], ['gas', '가스요금'], ['water', '수도요금']].map(([k, label]) => html`
          <div className="dynrow dynrow-plain" key=${k}>
            <span className="fixname">${label}</span>
            <${MoneyInput} value=${st.util[k]} ariaLabel=${label} onChange=${(v) => up((s) => { s.util[k] = v; })} />
            <${Pct} amt=${st.util[k]} sales=${sales} />
          </div>`)}
        ${totLine('공과금 합계', c.utilTotal, grades.util)}
      <//>

      <!-- 6. 기타 고정 지출 (로열티 없음) -->
      <${Section} num="6" title="기타 고정 지출" sub="카드수수료는 매출 입력 시 자동 계산됩니다.">
        <div className="dynrow dynrow-plain">
          <span className="fixname">마케팅비</span>
          <${MoneyInput} value=${st.fixedCost.mkt} ariaLabel="마케팅비" onChange=${(v) => up((s) => { s.fixedCost.mkt = v; })} />
          <${Pct} amt=${st.fixedCost.mkt} sales=${sales} />
        </div>
        ${autoRow('카드수수료', '매출의 1.1% 자동 계산', c.card)}
        ${totLine('기타 고정 지출 합계', c.fixedTotal, grades.fixed)}
      <//>

      <!-- 7. 기타비용 -->
      <${Section} num="7" title="기타비용" sub="예: 렌탈료, 인터넷, CCTV, 배달플랫폼 비용, 보험료, 대출이자 등">
        ${[['taxsvc', '세무기장료'], ['repair', '수리유지비']].map(([k, label]) => html`
          <div className="dynrow dynrow-plain" key=${k}>
            <span className="fixname">${label}</span>
            <${MoneyInput} value=${st.othersFixed[k]} ariaLabel=${label} onChange=${(v) => up((s) => { s.othersFixed[k] = v; })} />
            <${Pct} amt=${st.othersFixed[k]} sales=${sales} />
          </div>`)}
        ${st.others.map((row, i) => dynRow(row, '상세항목명 (예: 정수기 렌탈)',
          (v) => up((s) => { s.others[i].name = v; }),
          (v) => up((s) => { s.others[i].amt = v; }),
          () => up((s) => { s.others.splice(i, 1); })))}
        <button type="button" className="addbtn no-print" onClick=${() => up((s) => { s.others.push({ id: newId(), name: '', amt: 0 }); })}>+ 기타비용 추가</button>
        ${totLine('기타비용 합계', c.othersTotal, grades.others)}
      <//>

      <!-- 8. 세금 (자동 계산) -->
      <${Section} num="8" title="세금" sub="매출을 입력하면 자동으로 계산되어 순이익에서 차감됩니다.">
        ${autoRow('부가세', '매출의 4% 자동 계산', c.vat)}
        ${autoRow('소득세·법인세', '매출의 0.5% 자동 계산', c.income)}
        <p className="hint">자동 계산 세금은 단순 경영관리용이며 실제 납부세액은 매입세액, 사업자 형태 및 세무조정에 따라 달라집니다.</p>
      <//>

      <!-- 9. 손익 요약 -->
      <${Section} num="9" title="손익 요약">
        <div className="finaltable">
          ${summaryRows}
          <div className="sumrow">
            <span className="sumrow-label">부가세 (매출의 4%)</span>
            <span className="sumrow-amt">${fmt(c.vat)}<span className="won">원</span></span>
            <span className="sumrow-pct">${pctStr(c.vat, sales)}</span>
          </div>
          <div className="sumrow">
            <span className="sumrow-label">소득세, 법인세 (매출의 0.5%)</span>
            <span className="sumrow-amt">${fmt(c.income)}<span className="won">원</span></span>
            <span className="sumrow-pct">${pctStr(c.income, sales)}</span>
          </div>
        </div>
        <div className=${'finalprofit finalprofit-big ' + (grades.net === 'bad' ? 'neg' : grades.net === 'good' ? 'pos' : '')}>
          <span>순이익<${Badge} grade=${grades.net} /></span>
          <b>${fmt(c.finalProfit)}원</b>
          <i>${pctStr(c.finalProfit, sales)}</i>
        </div>
        <p className="legend">
          <span className="diagbadge good">GOOD</span> 기준 충족(파란색) ·
          <span className="diagbadge danger">점검필요</span> 기준 초과(빨간색)
        </p>
        <p className="hint">순이익 = 영업이익 − 부가세(매출의 4%) − 소득세·법인세(매출의 0.5%)</p>
      <//>

      <footer className="foot">
        <p>본 정산서는 든든해장국밥 매장 경영관리를 위한 간편 정산자료이며 세무신고용 손익계산서가 아닙니다.</p>
        <p>입력자료는 본사 서버로 자동 전송되지 않습니다. 작성 완료 후 요약 이미지 또는 상세 PDF를 매장 카카오톡방에 올려주세요.</p>
        <p className="credit">Created by 맥형</p>
      </footer>

      <!-- 하단 고정 버튼 -->
      <div className="bottombar no-print">
        <button type="button" className="bigbtn primary" disabled=${busy} onClick=${makePng}>
          📷 카톡용 요약 이미지
        </button>
        <button type="button" className="bigbtn" disabled=${busy} onClick=${makePdf}>
          📄 상세 정산 PDF
        </button>
      </div>

      ${modal ? html`<div className="modal-back no-print" onClick=${(e) => { if (e.target === e.currentTarget) closeModal(); }}>
        <div className="modal" role="dialog" aria-label="생성된 파일">
          <div className="modal-head">
            <b>${modal.kind === 'png' ? '카톡용 요약 이미지' : '상세 정산 PDF'}</b>
            <button type="button" className="modal-x" aria-label="닫기" onClick=${closeModal}>×</button>
          </div>
          <p className="modal-file">${modal.filename}</p>
          ${modal.kind === 'png' && modal.url
            ? html`<div className="modal-imgwrap"><img src=${modal.url} alt="정산 요약 이미지 미리보기" /></div>`
            : null}

          ${IS_KAKAO_INAPP ? html`<div className="kakao-warn">
            ⚠️ 지금 <b>카카오톡 안 브라우저</b>로 열려 있어 저장·공유가 막힐 수 있습니다.
            ${modal.kind === 'png' ? html`<br />위 이미지를 <b>길게 눌러 ‘사진 저장’</b>이 되면 바로 카톡에 첨부하실 수 있고, 안 되면 아래 버튼으로 크롬·사파리에서 다시 만들어 주세요.` : html`<br />아래 버튼으로 크롬·사파리에서 열어 다시 만들어 주세요.`}
            <button type="button" className="btn btn-primary kakao-open" onClick=${openExternalBrowser}>크롬·사파리로 열기</button>
          </div>` : null}

          ${!IS_KAKAO_INAPP && !IS_MOBILE ? html`<p className="modal-tip">
            ${modal.kind === 'png'
              ? html`PC에서는 <b>[이미지 복사]</b> 후 카카오톡 채팅창에 <b>붙여넣기(Ctrl+V)</b> 하는 것이 가장 빠릅니다. 또는 [파일로 저장] 후 저장된 파일을 채팅방에 끌어다 놓으세요.`
              : html`PC에서는 <b>[파일로 저장]</b> 후 저장된 PDF 파일을 카카오톡 채팅방에 <b>끌어다 놓으면</b> 전송됩니다.`}
          </p>` : null}

          ${!IS_KAKAO_INAPP && IS_MOBILE ? html`<p className="modal-tip">
            <b>[공유하기]</b>를 누르고 공유창에서 <b>카카오톡</b>을 선택하세요.
            ${modal.kind === 'png' ? html` 안 되면 위 이미지를 <b>길게 눌러 ‘사진 저장’</b> 후 카톡에서 사진 첨부로 올려주세요.` : html` 안 되면 [파일로 저장] 후 카톡에서 파일 첨부로 올려주세요.`}
          </p>` : null}

          ${modal.kind === 'png' ? html`<p className="modal-caution">
            ⚠️ ‘링크/주소 복사’는 사용하지 마세요 — 그 주소는 본인 기기에서만 열리고 다른 사람은 볼 수 없습니다.
            반드시 <b>이미지·파일 자체</b>를 올려주세요.
          </p>` : null}

          <div className="modal-btns">
            ${!IS_KAKAO_INAPP && IS_MOBILE ? html`<button type="button" className="btn btn-primary" onClick=${doShare}>공유하기</button>` : null}
            ${modal.kind === 'png' && !IS_MOBILE && !IS_KAKAO_INAPP ? html`<button type="button" className="btn btn-primary" onClick=${doCopyImage}>이미지 복사</button>` : null}
            ${!IS_KAKAO_INAPP && !IS_MOBILE ? html`<button type="button" className="btn" onClick=${doShare}>공유하기</button>` : null}
            <button type="button" className="btn" onClick=${doDownload}>파일로 저장</button>
            <button type="button" className="btn" onClick=${closeModal}>닫기</button>
          </div>
        </div>
      </div>` : null}

      ${toast ? html`<div className="toast" role="status">${toast}</div>` : null}
    </div>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
</body></html>
